<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- The card a shared link to shellwing.app shows: og/render.mjs makes
       public/og-image.png from it. -->
  <defs>
    <radialGradient id="glow" cx="0.2" cy="0" r="0.9">
      <stop offset="0" stop-color="#38bdf8" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="1" cy="1" r="0.8">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="0.5" stop-color="#38bdf8"/>
      <stop offset="1" stop-color="#a78bfa"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fbfcfe"/>
      <stop offset="1" stop-color="#e3e8ee"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="630" fill="#04060a"/>
  <rect width="1200" height="630" fill="url(#glow)"/>
  <rect width="1200" height="630" fill="url(#glow2)"/>

  <!-- The logo and the name -->
  <g transform="translate(80 80)">
    <rect x="0" y="0" width="72" height="72" rx="18" fill="url(#tile)" stroke="#b9c3cf" stroke-width="2"/>
    <path d="M3 17c4-1 7-4 9-9 1 4 4 7 9 8-5 1-8 2-9 5-1-3-4-4-9-4z" transform="translate(7 -1) scale(2.45)" fill="#0284c7"/>
    <text x="96" y="50" font-family="Inter Display, Inter, sans-serif" font-size="40" font-weight="800" fill="#ffffff">shell<tspan fill="#38bdf8">wing</tspan></text>
  </g>

  <text x="80" y="268" font-family="Inter Display, Inter, sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="#ffffff">The SSH client that</text>
  <text x="80" y="352" font-family="Inter Display, Inter, sans-serif" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#title)">feels native.</text>

  <text x="80" y="420" font-family="Inter, sans-serif" font-size="27" fill="#94a3b8">Tabs, panes, SFTP, snippets and a synced vault,</text>
  <text x="80" y="456" font-family="Inter, sans-serif" font-size="27" fill="#94a3b8">in a GPU-rendered terminal built with Rust and Zig.</text>

  <!-- The platforms -->
  <g font-family="Inter, sans-serif" font-size="22" font-weight="600" fill="#7dd3fc">
    <rect x="80" y="510" width="128" height="44" rx="22" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="144" y="539" text-anchor="middle">macOS</text>
    <rect x="222" y="510" width="146" height="44" rx="22" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="295" y="539" text-anchor="middle">Windows</text>
    <rect x="382" y="510" width="112" height="44" rx="22" fill="#38bdf8" fill-opacity="0.1" stroke="#38bdf8" stroke-opacity="0.4"/>
    <text x="438" y="539" text-anchor="middle">Linux</text>
    <text x="520" y="539" fill="#5b6b82">shellwing.app</text>
  </g>

  <!-- A terminal at the right edge -->
  <g transform="translate(860 150)">
    <rect x="0" y="0" width="420" height="330" rx="16" fill="#272e38" stroke="#ffffff" stroke-opacity="0.12"/>
    <path d="M16 0h388a16 16 0 0 1 16 16v26H0V16A16 16 0 0 1 16 0z" fill="#0f1522"/>
    <circle cx="22" cy="21" r="6" fill="#f87171"/>
    <circle cx="42" cy="21" r="6" fill="#fbbf24"/>
    <circle cx="62" cy="21" r="6" fill="#4ade80"/>
    <g font-family="JetBrains Mono, DejaVu Sans Mono, monospace" font-size="17">
      <text x="22" y="86" fill="#4ade80">web-01<tspan fill="#e2e8f0">:~$ uptime</tspan></text>
      <text x="22" y="116" fill="#e2e8f0">up 41 days, load 0.42</text>
      <text x="22" y="156" fill="#4ade80">web-01<tspan fill="#e2e8f0">:~$ docker ps -q | wc -l</tspan></text>
      <text x="22" y="186" fill="#e2e8f0">12</text>
      <text x="22" y="226" fill="#4ade80">web-01<tspan fill="#e2e8f0">:~$ </tspan></text>
      <rect x="114" y="211" width="10" height="20" fill="#4cc4f9"/>
    </g>
  </g>
</svg>
